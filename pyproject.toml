[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crispr-trace"
version = "0.1.0"
description = "An explainable SpCas9 off-target scanning tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100",
    "streamlit>=1.30",
    "uvicorn>=0.23",
]

[project.scripts]
crispr-trace = "crispr_trace.cli:main"
crispr-api = "crispr_trace.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
